kind = "web"
previewPath = "/"
title = "BLOOB"
version = "1.0.0"
id = "artifacts/bloob"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23017

[services.development]
run = "pnpm --filter @workspace/bloob run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bloob", "run", "build" ]
publicDir = "artifacts/bloob/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23017"
BASE_PATH = "/"
